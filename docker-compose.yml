version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: systemcraft-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - systemcraft-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: systemcraft-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/systemcraft
      - JWT_SECRET=super_production_secret_token_change_me_987654321
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb
    networks:
      - systemcraft-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: systemcraft-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - systemcraft-net

volumes:
  mongo_data:

networks:
  systemcraft-net:
    driver: bridge
